[package]
name = "ormify"
version = "1.0.3"
edition = "2024"

description = "Universal ORM Framework for your database."
license = "MIT"

repository = "https://github.com/Fasterino/ormify"
homepage = "https://github.com/Fasterino/ormify"
readme = "README.md"

[features]
default = []
full = ["orm_engine", "serde_requests", "proc_macro"]

orm_engine = []
serde_requests = []
proc_macro = ["ormify_macro"]

bench = ["orm_engine"]

[dependencies]
ormify_macro = { version = "1.0.2", path = "./proc_macro", optional = true }

chrono = "0.4.44"
serde = { version = "1.0.228", features = ["derive"] }
uuid = { version = "1.22.0", features = ["v4"] }
serde_cbor = "0.11.2"
fnv = "1.0.7"

[package.metadata.docs.rs]
all-features = true
